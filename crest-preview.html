<!doctype html><meta charset="utf-8"><style>#loading-screen{position:fixed!important;inset:0!important;z-index:2147483000!important;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 36%,#15362e 0,transparent 44%),radial-gradient(ellipse at 80% 90%,#172530 0,transparent 45%),#060e13!important;color:#e8f6f0;font-family:Segoe UI,Arial,sans-serif!important;transition:opacity .18s ease}
#loading-screen.crest-entered{opacity:0;pointer-events:none}
.crest-entry{width:min(520px,calc(100vw - 48px));text-align:center;padding:32px 0}
.crest-entry::before{content:'';position:absolute;width:280px;height:280px;border:1px solid #a4dcc510;left:50%;top:46%;transform:translate(-50%,-50%) rotate(45deg);border-radius:44px;pointer-events:none}
.crest-emblem{width:100px;height:116px;margin:0 auto 28px;filter:drop-shadow(0 8px 25px #77e2b82b);position:relative}
#loading-screen .ls-title{position:static!important;transform:none!important;font:600 42px/1 Segoe UI,Arial,sans-serif!important;color:#eaf7ef!important;letter-spacing:.28em!important;text-shadow:none!important;margin:0 0 14px;padding-left:.28em}
.crest-entry-tag{font-size:10px;font-weight:600;letter-spacing:.34em;color:#8bbba9;margin-bottom:44px}
#loading-screen #ls-message{position:static;display:block;font:400 14px/1.7 Segoe UI,Arial,sans-serif!important;color:#b3cbc3;min-height:46px;max-width:440px;margin:0 auto 16px}
.crest-entry-track{height:3px;border-radius:5px;background:#c3e5d312;overflow:hidden;margin:0 auto 18px;max-width:300px}
.crest-entry-track span{display:block;height:100%;width:28%;background:linear-gradient(90deg,#85e3b8,#e0d39a);border-radius:5px;transition:width .3s ease;animation:crest-breathe 1.8s ease-in-out infinite}
.crest-entry-steps{display:flex;justify-content:center;gap:25px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#68877d}.crest-entry-steps [data-ready=true]{color:#adddc8}
#crest-start-retry{border:1px solid #a7dbc842;border-radius:10px;background:#16322b;color:#def1e7;padding:10px 22px;margin:20px 0 0;cursor:pointer;font:600 13px Segoe UI,sans-serif}#crest-start-retry[hidden]{display:none}
.crest-entry-help{display:block;margin-top:28px;color:#6f9385;font-size:11px;text-decoration:none}.crest-entry-help:hover{color:#bfdfcf}.crest-entry button:focus-visible,.crest-entry a:focus-visible{outline:2px solid #bde8d3;outline-offset:4px}
@keyframes crest-breathe{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.crest-entry-track span{animation:none}#loading-screen{transition:none}}
